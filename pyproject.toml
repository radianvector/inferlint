[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inferlint"
version = "0.3.0"
description = "Measures what your inference server actually did—and flags what it didn't tell you."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "RadianVector", email = "hello@radianvector.com" }]
keywords = ["vllm", "llm", "inference", "benchmark", "prometheus", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Benchmark",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://radianvector.com/open-source/"
Company = "https://radianvector.com/"
Source = "https://github.com/radianvector/inferlint"
Issues = "https://github.com/radianvector/inferlint/issues"
Documentation = "https://radianvector.github.io/inferlint/"
Changelog = "https://github.com/radianvector/inferlint/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[project.scripts]
inferlint = "inferlint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferlint"]

[tool.hatch.build.targets.sdist]
exclude = ["*.internal.md", "_internal/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a live server on a real GPU; never runs in CI"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET"]
# N818: TripwireFailed / ServerRestarted read better than *Error here.
ignore = ["RET504", "N818"]

[tool.ruff.lint.per-file-ignores]
# test data: log lines and Prometheus samples are quoted verbatim
"tests/**" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
strict = ["src"]
executionEnvironments = [{ root = "tests", extraPaths = ["src", "tests"] }, { root = "src" }]
