[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inferlint"
version = "0.1.0.dev0"
description = "Things your inference server doesn't tell you, turned into checks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "RadianVector", email = "hello@radianvector.com" }]
keywords = ["vllm", "llm", "inference", "benchmark", "prometheus", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Benchmark",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[project.scripts]
inferlint = "inferlint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferlint"]

[tool.hatch.build.targets.sdist]
exclude = ["*.internal.md", "_internal/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a live server on a real GPU; never runs in CI"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET"]
# N818: TripwireFailed / ServerRestarted read better than *Error here.
ignore = ["RET504", "N818"]

[tool.ruff.lint.per-file-ignores]
# test data: log lines and Prometheus samples are quoted verbatim
"tests/**" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
strict = ["src"]
executionEnvironments = [{ root = "tests", extraPaths = ["src", "tests"] }, { root = "src" }]
